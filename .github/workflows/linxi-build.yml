name: Vue Build By Linxi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, linxi]
    tags: ['Vue-Yuxi-v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write #permissions for deploying to GitHub Pages
  id-token: write

jobs:
  build:
    name: 构建 Vue 项目 By Linxi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (检查代码并拉取)
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装 依赖
        run: npm ci

      # 1. 正常默认编译 -> 用于常规产物与 Release
      - name: 构建常规产物 (默认路径)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vue-Yuxi-website
          path: dist/
          if-no-files-found: error

      # 2. 带 --base=/linxi/ 编译 -> 专用于 GitHub Pages 部署
      - name: 构建 Pages 产物 --base=/${{ github.event.repository.name }}/
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: 复制 index.html 为 404.html
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  
  release:
    name: 发布预发布版本 By Linxi
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Vue-Yuxi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Vue-Yuxi-website
          path: dist/

      - name: Package website
        working-directory: dist
        run: zip -r ../Vue-Yuxi-website.zip .

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq 'Vue-Yuxi-website.zip' <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" Vue-Yuxi-website.zip
            fi
          else
            gh release create "$GITHUB_REF_NAME" Vue-Yuxi-website.zip \
              --verify-tag \
              --title "Vue-Yuxi Frontend $GITHUB_REF_NAME" \
              --notes "FlowViz 业务前端演示构建。" \
              --prerelease
          fi

 
