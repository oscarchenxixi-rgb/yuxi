name: Vue Build By Linxi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, linxi]
    tags: ['Vue-Yuxi-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Vue 项目 By Linxi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (检查代码并拉取)
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装 依赖
        run: npm ci

      - name: 构建 项目
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linxi-website 
          path: dist/
          if-no-files-found: error

  
  release:
    name: 发布预发布版本 By Linxi
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Vue-Yuxi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linxi-website
          path: dist/

      - name: Package website
        working-directory: dist
        run: zip -r ../linxi-website.zip .

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq 'linxi-website.zip' <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" linxi-website.zip
            fi
          else
            gh release create "$GITHUB_REF_NAME" linxi-website.zip \
              --verify-tag \
              --title "Vue-Yuxi Frontend $GITHUB_REF_NAME" \
              --notes "FlowViz 业务前端演示构建。" \
              --prerelease
          fi

 
    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
      